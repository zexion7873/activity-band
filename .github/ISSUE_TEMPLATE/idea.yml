name: Idea
description: Something the band should show, or show differently
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What is annoying you
      description: The situation, not the solution. The moment you had to open a panel or scroll up to learn what the session was doing.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What you had in mind
      description: Optional. A rough shape is fine, and so is "no idea, but this bothers me."

  - type: dropdown
    id: area
    attributes:
      label: Which part, if you know
      options:
        - Plan row
        - Agents row
        - Hover cards
        - Install or docs
        - Not sure
